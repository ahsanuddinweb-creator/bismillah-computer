<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#087f6b">
  <title>পেজ পাওয়া যায়নি | বিসমিল্লাহ কম্পিউটার</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .error-page{min-height:70vh;display:grid;place-items:center;text-align:center;padding:64px 20px}
    .error-code{font-size:clamp(76px,18vw,150px);font-weight:800;line-height:.95;color:var(--brand);letter-spacing:-.06em;margin:0}
    .error-page h1{font-size:clamp(26px,5vw,42px);margin:18px 0 8px}
    .error-page p{max-width:520px;color:var(--muted);margin:0 auto 24px}
  </style>
</head>
<body>
  <main class="error-page">
    <div>
      <p class="error-code" aria-hidden="true">404</p>
      <h1>দুঃখিত, পেজটি খুঁজে পাওয়া যায়নি</h1>
      <p>লিংকটি ভুল হতে পারে অথবা পেজটি সরানো হয়েছে। হোম পেজে ফিরে গিয়ে প্রয়োজনীয় সেবাটি খুঁজে নিন।</p>
      <a class="btn" href="/">হোম পেজে ফিরে যান</a>
      <a class="btn btn-light" href="/contact">যোগাযোগ</a>
    </div>
  </main>
</body>
</html>
